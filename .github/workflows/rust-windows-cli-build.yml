name: Rust Windows CLI Build (openshell-cli)

# Build Rust CLI binary for Windows x64 and ARM64 architectures.
# Produces standalone .exe artifacts that can be distributed to Windows users.

on:
  workflow_call:
    inputs:
      arch:
        description: "Windows architecture to build (x64 or arm64)"
        required: true
        type: string
      cargo-version:
        description: "Pre-computed cargo version (skips internal git-based computation)"
        required: false
        type: string
        default: ""
      features:
        description: "Cargo features to enable"
        required: false
        type: string
        default: "bundled-z3,openshell-core/dev-settings"
      retention-days:
        description: "Artifact retention period"
        required: false
        type: number
        default: 5
      artifact-name:
        description: "Artifact name override"
        required: false
        type: string
        default: ""
      checkout-ref:
        description: "Git ref to check out for build inputs (defaults to the workflow SHA)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  rust-windows-cli-build:
    name: cli (windows-${{ inputs.arch }})
    runs-on: ${{ inputs.arch == 'arm64' && 'windows-latest-arm64' || 'windows-latest' }}
    timeout-minutes: 60
    env:
      ARCH: ${{ inputs.arch }}
      FEATURES: ${{ inputs.features }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs['checkout-ref'] || github.sha }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Resolve build target
        id: target
        run: |
          set -euo pipefail

          crate=openshell-cli
          binary=openshell

          case "$ARCH" in
            x64)
              target=x86_64-pc-windows-msvc
              ;;
            arm64)
              target=aarch64-pc-windows-msvc
              ;;
            *)
              echo "unsupported arch: $ARCH" >&2
              exit 1
              ;;
          esac

          {
            echo "crate=$crate"
            echo "binary=$binary"
            echo "target=$target"
          } >> "$GITHUB_OUTPUT"

      - name: Cache Rust target and registry
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: rust-windows-cli-${{ inputs.arch }}
          cache-targets: "true"

      - name: Install Python (for version script)
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Compute cargo version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs['cargo-version'] }}" ]]; then
            echo "cargo_version=${{ inputs['cargo-version'] }}" >> "$GITHUB_OUTPUT"
          else
            echo "cargo_version=$(uv run python tasks/scripts/release.py get-version --cargo)" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch workspace version
        if: steps.version.outputs.cargo_version != ''
        shell: bash
        run: |
          set -euo pipefail
          # Use sed compatible with both GNU and BSD (via git bash on Windows)
          sed -i.bak -E '/^\[workspace\.package\]/,/^\[/{s/^version[[:space:]]*=[[:space:]]*".*"/version = "'"${{ steps.version.outputs.cargo_version }}"'"/}' Cargo.toml
          rm -f Cargo.toml.bak

      - name: Add Rust target
        run: rustup target add ${{ steps.target.outputs.target }}

      - name: Build ${{ steps.target.outputs.binary }}.exe (${{ steps.target.outputs.target }})
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          # z3 needs C++ standard library on Windows
          CXXSTDLIB: "msvc"
        run: |
          set -euo pipefail
          args=(
            --release
            --target "${{ steps.target.outputs.target }}"
            -p "${{ steps.target.outputs.crate }}"
            --bin "${{ steps.target.outputs.binary }}"
          )
          if [[ -n "$FEATURES" ]]; then
            args+=(--features "$FEATURES")
          fi
          if [[ -n "${{ steps.version.outputs.cargo_version }}" ]]; then
            export GIT_DIR=/nonexistent
          fi
          cargo build "${args[@]}"

      - name: Verify packaged binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ steps.target.outputs.target }}/release/${{ steps.target.outputs.binary }}.exe"
          test -f "$BIN"
          # Run --version to verify the binary works
          OUTPUT="$("$BIN" --version)"
          echo "$OUTPUT"
          grep -q "^${{ steps.target.outputs.binary }} " <<<"$OUTPUT"

      - name: Stage binary for artifact
        shell: bash
        run: |
          set -euo pipefail
          STAGE="prebuilt-binaries/$ARCH"
          mkdir -p "$STAGE"
          cp "target/${{ steps.target.outputs.target }}/release/${{ steps.target.outputs.binary }}.exe" \
            "$STAGE/${{ steps.target.outputs.binary }}.exe"
          ls -lh "$STAGE/"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs['artifact-name'] != '' && inputs['artifact-name'] || format('rust-binary-cli-windows-{0}', inputs.arch) }}
          path: prebuilt-binaries/${{ inputs.arch }}/${{ steps.target.outputs.binary }}.exe
          retention-days: ${{ inputs['retention-days'] }}
          if-no-files-found: error
