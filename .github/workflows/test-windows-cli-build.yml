name: Test Windows CLI Build

# Test workflow for building the Windows CLI binary.
# Can be triggered manually or on PRs with the 'test-windows-build' label.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architecture to build (x64, arm64, or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - x64
          - arm64
          - all
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  should-run:
    name: Check if workflow should run
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      build-x64: ${{ steps.check.outputs.build-x64 }}
      build-arm64: ${{ steps.check.outputs.build-arm64 }}
    steps:
      - id: check
        shell: pwsh
        run: |
          # workflow_dispatch always runs
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            if ("${{ inputs.arch }}" -eq "all" -or "${{ inputs.arch }}" -eq "x64") {
              "build-x64=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            } else {
              "build-x64=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            }
            if ("${{ inputs.arch }}" -eq "all" -or "${{ inputs.arch }}" -eq "arm64") {
              "build-arm64=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            } else {
              "build-arm64=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            }
          }
          # PRs always run
          elseif ("${{ github.event_name }}" -eq "pull_request") {
            "run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            # Build both architectures for PRs
            "build-x64=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "build-arm64=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "run=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

  build-windows-cli-x64:
    name: Build Windows CLI (x64)
    needs: should-run
    if: needs.should-run.outputs.run == 'true' && needs.should-run.outputs.build-x64 == 'true'
    uses: ./.github/workflows/rust-windows-cli-build.yml
    with:
      arch: x64
      checkout-ref: ${{ github.sha }}
      retention-days: 5
    secrets: inherit

  build-windows-cli-arm64:
    name: Build Windows CLI (ARM64)
    needs: should-run
    if: needs.should-run.outputs.run == 'true' && needs.should-run.outputs.build-arm64 == 'true'
    uses: ./.github/workflows/rust-windows-cli-build.yml
    with:
      arch: arm64
      checkout-ref: ${{ github.sha }}
      retention-days: 5
    secrets: inherit

  summary:
    name: Build Summary
    needs: [should-run, build-windows-cli-x64, build-windows-cli-arm64]
    if: always() && needs.should-run.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report build results
        shell: pwsh
        run: |
          "## Windows CLI Build Results" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          if ("${{ needs.build-windows-cli-x64.result }}" -eq "success") {
            "✅ x64 build: SUCCESS" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } elseif ("${{ needs.build-windows-cli-x64.result }}" -eq "skipped") {
            "⏭️ x64 build: SKIPPED" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "❌ x64 build: FAILED" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

          if ("${{ needs.build-windows-cli-arm64.result }}" -eq "success") {
            "✅ ARM64 build: SUCCESS" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } elseif ("${{ needs.build-windows-cli-arm64.result }}" -eq "skipped") {
            "⏭️ ARM64 build: SKIPPED" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "❌ ARM64 build: FAILED" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Artifacts are available in the Actions tab." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
